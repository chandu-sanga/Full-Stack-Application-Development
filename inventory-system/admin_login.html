<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login - Relational Inventory Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css">
  <script src="admin_login.js" defer></script>
</head>
<body>
  <div class="background-effects"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <main class="container login-container">
    <div class="card login-card">
      <div class="login-header">
        <i class="ph ph-shield-check"></i>
        <h2>Admin Authentication</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Access the Admin Portal</p>
      </div>
      <form id="loginForm">
        <div class="input-group">
          <label>Admin Username</label>
          <div class="search-box" style="margin-top: 0;"><i class="ph ph-user-crown"></i><input type="text" id="username" placeholder="admin" required autofocus></div>
        </div>
        <div class="input-group">
          <label>Password</label>
          <div class="search-box" style="margin-top: 0;"><i class="ph ph-key"></i><input type="password" id="password" placeholder="admin123" required></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login to Admin <i class="ph ph-lock"></i></button>
      </form>
      <div style="text-align: center; margin-top: 1.5rem;"><a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem;"><i class="ph ph-caret-left"></i> Back to Home</a></div>
    </div>
  </main>
  <div id="toast-container"></div>
</body>
</html>
