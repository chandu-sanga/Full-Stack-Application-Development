<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Login - Relational Inventory Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css">
  <script src="user_login.js" defer></script>
</head>
<body>
  <div class="background-effects"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <main class="container login-container">
    <div class="card login-card">
      <div class="login-header">
        <i class="ph ph-user"></i>
        <h2>User Login</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Access the User Dashboard</p>
      </div>
      <form id="loginForm">
        <div class="input-group">
          <label>Username</label>
          <div class="search-box" style="margin-top: 0;"><i class="ph ph-user"></i><input type="text" id="username" placeholder="user" required autofocus></div>
        </div>
        <div class="input-group">
          <label>Password</label>
          <div class="search-box" style="margin-top: 0;"><i class="ph ph-key"></i><input type="password" id="password" placeholder="user123" required></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In <i class="ph ph-arrow-right"></i></button>
      </form>
      <div style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.875rem;">
        Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">Sign Up</a>
      </div>
      <div style="text-align: center; margin-top: 1rem;"><a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem;"><i class="ph ph-caret-left"></i> Back to Home</a></div>
    </div>
  </main>
  <div id="toast-container"></div>
</body>
</html>
